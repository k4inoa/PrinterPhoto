name: PrinterPhoto
options:
  bundleIdPrefix: com.jah
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  PrinterPhoto:
    type: application
    platform: iOS
    sources:
      - PrinterPhoto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jah.PrinterPhoto
        INFOPLIST_FILE: PrinterPhoto/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
  PrinterPhotoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PrinterPhotoTests
    dependencies:
      - target: PrinterPhoto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jah.PrinterPhotoTests
        INFOPLIST_FILE: PrinterPhotoTests/Info.plist
